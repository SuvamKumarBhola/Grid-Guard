[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gridguard"
version = "0.1.0"
description = "GridGuard — Autonomous Reliability Intelligence for Power Distribution Networks"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "GridGuard Core Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.6.0",
    "joblib>=1.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests"
]
asyncio_mode = "auto"
