apiVersion: apps/v1
kind: Deployment
metadata:
  name: gridguard-api
  namespace: gridguard
  labels:
    app.kubernetes.io/name: gridguard
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: gridguard-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gridguard-api
  template:
    metadata:
      labels:
        app: gridguard-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: gridguard-api
          image: gridguard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: gridguard-config
          env:
            - name: GRIDGUARD_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: gridguard-secrets
                  key: auth-secret
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
