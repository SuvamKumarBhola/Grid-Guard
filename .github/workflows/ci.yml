name: GridGuard CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Lint, Test & Validate Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate Model Artifact Contract
        run: |
          python scripts/validate_model_artifact.py \
            --dir model_artifacts/registered/gridguard-risk-0.1.0 \
            --require-approved \
            --verify-checksum

      - name: Verify Anomaly Detector v2.0.0 Acceptance Criteria
        run: |
          python scripts/verify_anomaly_v2_model.py

      - name: Run Full Test Suite
        run: |
          pytest tests/ -v --junitxml=junit.xml

      - name: Run Resilience & Load Test
        run: |
          python scripts/run_load_test.py --requests 100 --concurrency 5

  build-and-package:
    name: Container Build & Security Scan
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: gridguard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container Smoke Test
        run: |
          docker run -d --name gridguard-test -p 8000:8000 gridguard:latest
          sleep 5
          docker run --network container:gridguard-test curlimages/curl:latest curl --fail http://localhost:8000/api/v1/health
          docker stop gridguard-test
